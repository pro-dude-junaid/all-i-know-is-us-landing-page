<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All I Know Is Us — Junaid Siddique X Nisan Al Enlil</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap');

    :root{
      --bg:        #14140f;
      --panel:     #1b1b14;
      --ink:       #f2f0e6;
      --ink-dim:   #8c897c;
      --ink-faint: #55523f;
      --accent:    #e8b33d;
      --line:      #33322b;
      --radius:    2px;
      --max-w:     440px;
    }

    *{ box-sizing: border-box; }

    html{ -webkit-text-size-adjust: 100%; }

    body{
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 700px 500px at 50% -10%, #3a3320 0%, transparent 60%),
        linear-gradient(180deg, #1c1c15 0%, #14140f 45%, #0d0d09 100%);
      background-attachment: fixed;
      color: var(--ink);
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      display: flex;
      justify-content: center;
      padding: 48px 20px 64px;
    }

    @media (prefers-reduced-motion: no-preference){
      .card{
        animation: rise 0.6s ease both;
      }
    }
    @keyframes rise{
      from{ opacity: 0; transform: translateY(10px); }
      to{ opacity: 1; transform: translateY(0); }
    }

    .card{
      width: 100%;
      max-width: var(--max-w);
    }

    /* ---------- header / meta ---------- */

    .meta-row{
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12px;
      color: var(--ink-faint);
      letter-spacing: 0.02em;
      margin-bottom: 18px;
    }
    .meta-row span.dot{ color: var(--accent); }

    /* ---------- album art ---------- */

    .art{
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 1px dashed var(--ink-faint);
      border-radius: var(--radius);
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .art img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block; /* switched to block after setting a real src on #album-art or else none */
    }
    .art .placeholder{
      text-align: center;
      color: var(--ink-faint);
      padding: 24px;
    }
    .art .placeholder svg{
      width: 34px;
      height: 34px;
      margin-bottom: 12px;
      opacity: 0.7;
    }
    .art .placeholder p{
      margin: 0;
      font-size: 11px;
      letter-spacing: 0.06em;
    }
    .art .placeholder p.spec{
      margin-top: 4px;
      color: var(--ink-faint);
      opacity: 0.7;
    }

    /* ---------- title block ---------- */

    .title-block{
      margin-top: 28px;
      text-align: center;
    }
    h1{
      font-size: clamp(24px, 6vw, 32px);
      font-weight: 800;
      letter-spacing: -0.01em;
      margin: 0;
      line-height: 1.15;
    }
    .artist{
      margin-top: 8px;
      font-size: 15px;
      font-weight: 500;
      color: var(--ink-dim);
    }
    .genre{
      display: inline-block;
      margin-top: 14px;
      font-size: 11px;
      color: var(--accent);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 4px 10px;
    }

    /* ---------- divider ---------- */

    .divider{
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 32px 0 20px;
      color: var(--ink-faint);
      font-size: 11px;
    }
    .divider::before,
    .divider::after{
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    /* ---------- links ---------- */

    .links{
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .link-row{
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--ink);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
    }
    .link-row:hover,
    .link-row:focus-visible{
      border-color: var(--accent);
      background: #201f16;
      transform: translateX(2px);
    }
    .link-row:focus-visible{
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .link-row .prompt{
      color: var(--accent);
      flex-shrink: 0;
    }
    .link-row .label{
      flex: 1;
    }
    .link-row .icon{
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      opacity: 0.55;
    }

    /* ---------- footer ---------- */

    footer{
      margin-top: 36px;
      text-align: center;
      font-size: 11px;
      color: var(--ink-faint);
    }

    @media (max-width: 360px){
      body{ padding: 32px 14px 48px; }
      .link-row{ padding: 12px 14px; font-size: 13px; }
    }
  </style>
</head>
<body>

<div class="card">

  <div class="meta-row">
    <span>release<span class="dot">.</span>page</span>
    <span id="release-date">2026.09.12</span>
  </div>

  <!-- ================= ALBUM ART ================= -->
  <div class="art">
    <img id="album-art" src="./img/album_art.jpg" alt="Album artwork">
  </div>

  <!-- ================= TITLE / ARTIST / GENRE ================= -->
  <div class="title-block">
    <h1 id="album-title">All I Know Is Us</h1>
    <div class="artist" id="artist-name">Junaid Siddique X Nisan Al Enlil</div>
    <div class="genre" id="genre">R&B/Soul</div>
  </div>

  <div class="divider">listen on</div>

  <!-- ================= STREAMING LINKS ================= -->
  <!-- Swap each href="#" for your real link. -->
  <div class="links">

    <a class="link-row" href="#" target="_blank" rel="noopener">
      <span class="prompt">&gt;</span>
      <span class="label">Spotify</span>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M7 10c3-1 7-1 10 1M7.5 13c2.5-.7 5.5-.7 8 .5M8 16c2-.5 4.5-.5 6.5.5"/></svg>
    </a>

    <a class="link-row" href="#" target="_blank" rel="noopener">
      <span class="prompt">&gt;</span>
      <span class="label">Apple Music</span>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 15V9.5l6-1.2V13"/><circle cx="8" cy="15.5" r="1.4"/><circle cx="14" cy="14" r="1.4"/></svg>
    </a>

    <a class="link-row" href="#" target="_blank" rel="noopener">
      <span class="prompt">&gt;</span>
      <span class="label">Amazon Music</span>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 15c4 3 12 3 16 0"/><path d="M16 15l2-1"/><circle cx="12" cy="9" r="4.5"/></svg>
    </a>

    <a class="link-row" href="#" target="_blank" rel="noopener">
      <span class="prompt">&gt;</span>
      <span class="label">YouTube Music</span>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 9.3v5.4"/></svg>
    </a>

    <a class="link-row" href="https://youtu.be/6b8ko5fQx0k" target="_blank" rel="noopener">
      <span class="prompt">&gt;</span>
      <span class="label">Lyrical Video</span>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5.5" width="14" height="13" rx="2"/><path d="M17 10l4-2.5v9L17 14"/></svg>
    </a>

  </div>

  <footer>
    <span id="footer-artist">© JS Recordz · ℗ Nisan Al Enlil Records</span> — all rights reserved
  </footer>

</div>

</body>
</html>
